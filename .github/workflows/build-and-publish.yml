# Pages serves the repository root (branch deploy), so the built app must be
# committed at the root. This rebuilds it whenever the source under app/ changes.
name: Build & publish

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build single-file bundle
        working-directory: app
        env:
          SINGLE_FILE: '1'
          VITE_BASE: /
        run: pnpm build

      - name: Publish build to the repository root
        run: |
          cp app/dist/index.html index.html
          cp app/dist/404.html 404.html
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          if git diff --cached --quiet; then
            echo "No change to the built site."
          else
            git commit -m "Rebuild site from app/ [skip ci]"
            git push
          fi
